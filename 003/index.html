<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="theme-color" content="#fafafa" />
    <link rel="icon" href="data:," />
    <title>白相 · White Atelier</title>
    <link rel="stylesheet" href="./style.css" />
    <script type="module" src="./app.bundle.js"></script>
  </head>
  <body>
    <header class="masthead">
      <a class="wordmark" href="./" aria-label="白相ホーム"
        ><span class="wordmark-cn">白相<span class="brand-dot"></span></span
        ><span class="wordmark-en">WHITE ATELIER</span></a
      >
      <span class="collection-label"
        >個人コレクション <span>/</span> <span id="edition">STUDY 001</span></span
      >
      <div class="header-actions">
        <button
          class="icon-button"
          id="info"
          aria-label="作品情報"
          title="作品情報"
          disabled
        >
          <i data-lucide="info"></i>
        </button>
        <button
          class="icon-button save-button"
          id="save"
          aria-label="カード画像を保存"
          title="カード画像を保存"
          disabled
        >
          <i data-lucide="download"></i>
        </button>
      </div>
    </header>
    <main>
      <section class="gallery" aria-label="カードギャラリー">
        <div
          class="stage"
          id="stage"
          tabindex="0"
          role="group"
          aria-label="回転可能なホログラフィックカード"
        >
          <div id="loading" class="loading" role="status">
            <span class="loading-line"></span><span>作品を装幀しています</span>
          </div>
        </div>
        <div class="stage-note" aria-hidden="true">
          <span>ART STUDY</span><span id="view-label">01 / FRONT</span>
        </div>
        <div class="parameter-panel" id="parameter-panel">
          <div class="panel-heading">
            <span>奥行きと構図</span>
          </div>
          <label class="range-row" for="scale"
            ><span>画面スケール</span><output id="scale-value"></output
            ><input id="scale" type="range" min="0.95" max="1.35" step="0.01"
          /></label>
          <label class="range-row" for="depth"
            ><span>メイン奥行き</span><output id="depth-value"></output
            ><input id="depth" type="range" min="-0.45" max="0.45" step="0.01"
          /></label>
          <label class="range-row" for="fx-depth"
            ><span>エフェクト奥行き</span><output id="fx-depth-value"></output
            ><input id="fx-depth" type="range" min="-0.3" max="0.9" step="0.01"
          /></label>
          <label class="range-row" for="bg-depth"
            ><span>背景奥行き</span><output id="bg-depth-value"></output
            ><input id="bg-depth" type="range" min="-0.4" max="0.4" step="0.01"
          /></label>
        </div>
      </section>
      <section class="artwork-bar" aria-label="作品と質感">
        <div class="artwork-title">
          <div class="title-line">
            <h1 id="card-title">BOND</h1>
            <span id="subtitle">共生</span>
          </div>
          <p id="description">視点で揺れる星の光</p>
        </div>
        <div class="face-picker" role="group" aria-label="カードの向き">
          <button id="front" aria-pressed="true" disabled>表面</button
          ><button id="back" aria-pressed="false" disabled>裏面</button>
        </div>
        <div class="finish-cluster">
          <button
            id="depth-toggle"
            class="depth-toggle"
            type="button"
            aria-controls="parameter-panel"
            aria-expanded="true"
            aria-label="奥行き調整の表示／非表示"
            title="奥行き調整の表示／非表示"
          >
            <i data-lucide="sliders-horizontal"></i><span>奥行き調整</span>
          </button>
          <div class="finish-control">
          <div class="finish-heading">
            <span>カード質感</span>
            <div class="swatches" role="group" aria-label="カード面の質感">
              <button
                class="swatch pearl"
                data-finish="pearl"
                aria-pressed="true"
                aria-label="パール"
                title="パール"
                disabled
              ></button
              ><button
                class="swatch silver"
                data-finish="silver"
                aria-pressed="false"
                aria-label="シルバー"
                title="シルバー"
                disabled
              ></button
              ><button
                class="swatch gold"
                data-finish="gold"
                aria-pressed="true"
                aria-label="金箔"
                title="金箔"
                disabled
              ></button
              ><button
                class="swatch original"
                data-finish="original"
                aria-pressed="false"
                aria-label="原画"
                title="原画"
                disabled
              ></button>
            </div>
            <span id="finish-name">金箔</span>
          </div>
          <label class="foil-row" for="foil"
            ><span>光沢</span
            ><input
              id="foil"
              type="range"
              min="0"
              max="1"
              step="0.01"
              value="0.52"
              disabled
            /><output id="foil-value">52%</output></label
          >
          </div>
        </div>
      </section>
    </main>
    <footer class="footer">
      <span>光と影のあいだに、響きがある。</span><span>PERSONAL ART COLLECTION</span>
    </footer>
    <dialog id="about" aria-labelledby="about-title">
      <button
        id="close-about"
        class="icon-button modal-close"
        aria-label="閉じる"
        title="閉じる"
      >
        <i data-lucide="x"></i>
      </button>
      <p class="dialog-mark">白相</p>
      <h2 id="about-title">共生 / BOND</h2>
      <p id="about-description"></p>
      <dl>
        <div>
          <dt>出典</dt>
          <dd>ユーザー提供の参考作品</dd>
        </div>
        <div>
          <dt>形式</dt>
          <dd>個人アートカード習作</dd>
        </div>
        <div>
          <dt>番号</dt>
          <dd id="about-edition">STUDY 001</dd>
        </div>
      </dl>
    </dialog>
    <div id="notice" role="status" class="notice" hidden></div>
    <script type="module" src="./app.bundle.js"></script>
  </body>
</html>
